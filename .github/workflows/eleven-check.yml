name: Eleven checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned upstream metadata
        run: |
          grep -q "Release: v3.9.0" docs/UPSTREAM.md
          grep -q "Commit: 3cd4bf5" docs/UPSTREAM.md

      - name: Verify Eleven layer
        run: |
          test -f internal/eleven/identity/model.go
          test -f internal/eleven/service/model.go
          test -f internal/eleven/nodes/model.go
          test -f internal/eleven/audit/event.go
          test -f internal/eleven/adapter/xray.go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify generated API artifacts
        run: |
          cd frontend
          npm run gen
          cd ..
          git diff --exit-code -- frontend/src/generated frontend/public/openapi.json

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l internal)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: MSW worker check
        run: make msw-worker-check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test -shuffle=on -count=1 ./...

      - name: Go build
        run: go build ./...

      - name: Storybook build
        working-directory: frontend
        run: npm run build-storybook
